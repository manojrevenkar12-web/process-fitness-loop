name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: unit tests (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: build and test every module
        run: mvn -B -ntp verify
      - name: the container image builds
        run: docker build -q -f deploy/Dockerfile -t pfl:ci .
      - name: test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for p in glob.glob("*/target/surefire-reports/TEST-*.xml"):
              r = ET.parse(p).getroot()
              t += int(r.get("tests")); f += int(r.get("failures")); e += int(r.get("errors")); s += int(r.get("skipped"))
          print(f"{t} tests, {f} failures, {e} errors, {s} skipped")
          open("test-summary.txt", "w").write(f"{t} {f} {e} {s}\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: |
            */target/surefire-reports/*.xml
            test-summary.txt

  reproduce:
    name: reports are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: rerun the dev-world backtest evaluation and the hub experiment
        run: |
          mvn -B -ntp -q install -DskipTests
          mvn -B -ntp -q -pl pfl-world exec:java -Dexec.args="dev ."
          mvn -B -ntp -q -pl pfl-hub exec:java -Dexec.mainClass=io.github.mkp.pfl.hub.experiment.HubReliabilityExperiment -Dexec.args="reports/hub-reliability.json"
      - name: the committed numbers are the ones the code produces
        run: git diff --exit-code reports/backtest-dev.json reports/hub-reliability.json data/history-sample.jsonl

  engine:
    name: against Camunda 8.10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: start a single-node Camunda 8.10 cluster with H2 secondary storage
        run: |
          docker run -d --name camunda -p 8080:8080 -p 9600:9600 -p 26500:26500 \
            -e CAMUNDA_DATA_SECONDARYSTORAGE_TYPE=rdbms \
            -e "CAMUNDA_DATA_SECONDARYSTORAGE_RDBMS_URL=jdbc:h2:mem:camunda;DB_CLOSE_DELAY=-1" \
            -e CAMUNDA_DATA_SECONDARYSTORAGE_RDBMS_USERNAME=sa \
            -e CAMUNDA_DATA_SECONDARYSTORAGE_RDBMS_PASSWORD= \
            -e CAMUNDA_DATA_SECONDARYSTORAGE_RDBMS_FLUSHINTERVAL=PT0.5S \
            -e CAMUNDA_SECURITY_AUTHENTICATION_UNPROTECTEDAPI=true \
            -e CAMUNDA_SECURITY_AUTHORIZATIONS_ENABLED=false \
            camunda/camunda:8.10.9
      - name: run the engine tests
        env:
          CAMUNDA_URL: http://localhost:8080
        run: mvn -B -ntp -pl pfl-service -am -Pengine test -Dsurefire.failIfNoSpecifiedTests=false
      - name: print the engine reports
        if: always()
        run: |
          for f in reports/engine-equivalence.json reports/verifier-vs-engine.json; do
            echo "::group::$f"; python3 -c "import json,sys; print(json.dumps(json.load(open('$f')), separators=(',',':')))" "$f" | sed 's/^/REPORT /'; echo "::endgroup::"
          done
      - name: cluster log
        if: failure()
        run: docker logs camunda 2>&1 | tail -200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-reports
          path: |
            reports/engine-equivalence.json
            reports/verifier-vs-engine.json

  dashboard:
    name: dashboard builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm test
      - run: npm run build
